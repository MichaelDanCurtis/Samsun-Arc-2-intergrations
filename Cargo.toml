[package]
name = "deskswitch"
version = "0.1.0"
edition = "2024"
description = "Follow the keyboard: switch a Samsung Ark's input and Logitech Easy-Switch peripherals together"
license = "MIT"

[features]
default = []
streamdeck = ["dep:elgato-streamdeck", "dep:image", "dep:imageproc", "dep:ab_glyph"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
elgato-streamdeck = { version = "0.13", optional = true }
image = { version = "0.25", optional = true }
imageproc = { version = "0.25", optional = true }
ab_glyph = { version = "0.2", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
